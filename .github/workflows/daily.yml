name: פיד AI יומי

on:
  schedule:
    # 04:00 UTC - שים לב שהתזמון ב-UTC, כלומר 07:00 בשעון קיץ ו-06:00 בחורף
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - name: משיכת הריפו
        uses: actions/checkout@v4

      - name: התקנת Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: התקנת nodemailer
        run: npm install nodemailer --no-save

      - name: הרצת הפיד ושליחת המייל
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FEED_ACCENT: ${{ vars.FEED_ACCENT }}
          ITEM_COUNT: ${{ vars.ITEM_COUNT }}
          MODEL: ${{ vars.MODEL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        run: node feed.js

      - name: שמירת ההיסטוריה והארכיון חזרה לריפו
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json archive/
          git diff --staged --quiet || git commit -m "פיד AI יומי - $(date -u +%Y-%m-%d)"
          git push
